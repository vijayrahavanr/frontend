<!doctype html>
<!--
  GitHub Pages serves this file for any path that isn't a real file
  (i.e. any client-side route on refresh/deep-link), since it has no
  server-side rewrite support. This encodes the requested path into a
  query string and redirects to index.html, where the inline script
  in index.html decodes it back into the real URL via
  history.replaceState before React Router mounts. Standard
  spa-github-pages technique: https://github.com/rafgraph/spa-github-pages
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      var segmentCount = 0; // increase if deploying under a repo subpath, e.g. 1 for /repo-name/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?redirect=' +
          encodeURIComponent(l.pathname.slice(1).split('/').slice(segmentCount).join('/') + l.search + l.hash)
      );
    </script>
  </head>
  <body></body>
</html>
