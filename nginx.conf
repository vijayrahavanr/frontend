server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers -----------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    # camera=(self) is intentional: the app's QR/face-recognition
    # attendance features use getUserMedia. Tighten to () if those
    # features are disabled for a given deployment.

    # Gzip already-compressible text assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets (js/css/fonts/images from Vite's output) are
    # safe to cache forever — the filename changes on every new build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated, or users get stuck on a
    # stale build after a deploy (their cached HTML would keep
    # pointing at asset hashes that no longer exist).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any non-file route goes to index.html so React
    # Router can handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't serve dotfiles (e.g. a stray .env if one ever ends up in
    # the build context).
    location ~ /\. {
        deny all;
    }
}
