services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    image: ai-smart-attendance-frontend:latest
    ports:
      - '8080:80'
    restart: unless-stopped
